<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eagle 静态图库</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="left-panel" id="leftPanel">
      <div class="brand" id="libraryName">Eagle Multi Library</div>
      <button id="closeFolderPanel" class="mobile-close" type="button">收起分类</button>
      <div class="tree-title">分类导航</div>
      <nav id="folderTree" class="folder-tree"></nav>
    </aside>

    <main class="center-panel">
      <header class="toolbar">
        <button id="openFolderPanel" class="mobile-action" type="button">分类</button>
        <div class="toolbar-main">
          <div class="toolbar-title" id="toolbarTitle">全部图片</div>
          <nav id="breadcrumb" class="breadcrumb" aria-label="当前位置"></nav>
          <div class="toolbar-filters">
            <input id="searchInput" class="search" type="text" placeholder="搜索文件名、标签...  (/)" />
            <select id="sortSelect" class="control-select">
              <option value="latest">最新发布</option>
              <option value="modified">最近修改</option>
              <option value="name">名称 A-Z</option>
            </select>
            <button id="clearFilters" class="control-button" type="button">清空筛选</button>
          </div>
          <div id="tagFilters" class="tag-filters"></div>
        </div>
      </header>
      <section id="galleryViewport" class="gallery-viewport">
        <div id="gallerySpacer" class="gallery-spacer">
          <div id="galleryGrid" class="gallery-grid"></div>
        </div>
      </section>
    </main>

    <aside class="right-panel">
      <h2>图片详情</h2>
      <div id="preview" class="detail-image placeholder">预览</div>
      <div class="detail-actions">
        <button id="copyLinkBtn" class="control-button" type="button">复制直达链接</button>
        <a id="downloadBtn" class="control-button link-button" href="#" download>下载原图</a>
      </div>
      <div class="field"><label>文件名</label><input id="detailName" readonly /></div>
      <div class="field"><label>链接</label><input id="detailUrl" readonly /></div>
      <div class="field"><label>标签</label><input id="detailTags" readonly /></div>
      <div class="field"><label>所属库</label><input id="detailLibrary" readonly /></div>
      <div class="field"><label>所属目录</label><input id="detailFolderPath" readonly /></div>
      <div class="field"><label>备注</label><textarea id="detailAnnotation" readonly></textarea></div>
      <div class="meta-block">
        <div><span>尺寸</span><strong id="detailSize">-</strong></div>
        <div><span>格式</span><strong id="detailExt">-</strong></div>
        <div><span>大小</span><strong id="detailBytes">-</strong></div>
        <div><span>添加日期</span><strong id="detailAddTime">-</strong></div>
        <div><span>创建日期</span><strong id="detailCreateTime">-</strong></div>
        <div><span>修改日期</span><strong id="detailModifyTime">-</strong></div>
      </div>
    </aside>
  </div>
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="lightboxClose" class="lightbox-close" type="button">关闭</button>
    <button id="lightboxPrev" class="lightbox-nav lightbox-prev" type="button" aria-label="上一张">‹</button>
    <button id="lightboxNext" class="lightbox-nav lightbox-next" type="button" aria-label="下一张">›</button>
    <img id="lightboxImage" class="lightbox-image" alt="全屏预览" />
    <div class="lightbox-toolbar">
      <span id="lightboxCaption" class="lightbox-caption"></span>
      <a id="lightboxDownload" class="control-button link-button" href="#" download>下载原图</a>
    </div>
  </div>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
